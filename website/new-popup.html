<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIF</title>
    <link rel="stylesheet" href="assets/css/form.css">
    <link rel="stylesheet" href="assets/bootstarp/bootstrap.min.css">
    <link rel="stylesheet" href="assets/fonts/webfont/stylesheet.css">
    <link rel="stylesheet" href="assets/css/custom-style.css">
    <link rel="shortcut icon" href="assets/images/fav-icon.png" type="image/x-icon">
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@24.1.3/build/css/intlTelInput.css"> -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.6-rc.0/css/select2.min.css" rel="stylesheet" />
</head>

<body>
    <section class="main-container">
        <div class="logo-container">
            <div class="container">
                <div class="image-container">
                    <img src="assets/images/PIF_3.png" alt="" class="d-block footer-logo">
                </div>
            </div>
        </div>
        <div class="container">
            <div class="new-popup-min-height">
            <div class="new-popup-box wow bounceInUp" data-wow-duration="2s">
                <h4>Would you like to attend this event and proceed with registration?</h4>

                <div class="new-popup-box-btns">
                    <button type="button" class="button2">Yes</button>
                    <button type="button" class="button3"data-bs-toggle="modal" data-bs-target="#exampleModal">Not interested</button>
                </div>
            </div>
            </div>
        </div>

        <!-- popup -->
        <div class="modal fade" id="exampleModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
              <div class="modal-content">
                <div class="modal-header">
                    <div></div>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">X</button>
                </div>
                <div class="modal-body new-popup-modal-para">

                    <p class="text-center ">
                        Thank you for your time. We’re sorry to hear you won’t be able to attend.
                    </p>

                <div class="modal-footer">

                        <button type="button" class="button3" data-bs-dismiss="modal">Close</button>
                  
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- close -->
    </section>

    <script src="assets/form-js/jquery-3.6.0.min.js"></script>
    <!-- <script src="assets/js/gsap.min.js"></script> -->
    <script src="assets/js/ScrollTrigger.min.js"></script>
    <script src="assets/js/script-1.js"></script>
    <script src="assets/f/bootstrap.min.js"></script>
    <script src="assets/form-js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/49ccdaea81.js" crossorigin="anonymous "></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@24.1.3/build/js/intlTelInput.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.6-rc.0/js/select2.min.js"></script> -->



    <script>
        $("#single").select2({
          placeholder: "Select a programming language",
          allowClear: true
      });
    </script>
</body>

</html>
